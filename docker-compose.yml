# Base docker-compose file.
# Production-ready defaults. Use override files for environment-specific settings.
# Activate with: ln -sf docker-compose.override-{env}.yml docker-compose.override.yml

services:

  informs:
    build:
      context: ./informs
    image: informs-app
    env_file:
      - informs/env/django.env
    # entrypoint: export static_files, migrate DB, then run "command"
    entrypoint: /opt/app/docker-entrypoint.sh
    # Gunicorn production config:
    #   --workers: CPU cores * 2 + 1 (default 3 for small VMs)
    #   --threads: 2-4 threads per worker for I/O bound apps
    #   --worker-class: gthread for thread-based concurrency
    #   --timeout: graceful worker timeout (default 30s)
    #   --keep-alive: match nginx proxy_read_timeout
    #   --max-requests: recycle workers to prevent memory leaks
    #   --max-requests-jitter: stagger worker recycling
    #   --forwarded-allow-ips: trust nginx proxy headers
    command: >-
      gunicorn
      --bind=0.0.0.0:8000
      --workers=${WORKERS:-3}
      --threads=${THREADS:-2}
      --worker-class=gthread
      --timeout=30
      --keep-alive=65
      --max-requests=1000
      --max-requests-jitter=50
      --forwarded-allow-ips="*"
      --access-logfile=-
      --error-logfile=-
      --capture-output
      informs.wsgi
    restart: unless-stopped
    ports:
     - 8000:8000
    volumes:
      - informs_staticfiles:/opt/app/static_files
      - local-db:/opt/app/db
      - certs:/opt/app/certs:z
      - informs_media:/opt/app/informs/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  queues:
    image: informs-app
    restart: unless-stopped
    env_file:
      - informs/env/django.env
    command: python manage.py qcluster
    volumes:
      - informs_staticfiles:/opt/app/static_files
      - local-db:/opt/app/db
      - certs:/opt/app/certs:z
      - informs_media:/opt/app/informs/media
    # django-q2 uses ORM broker (SQLite), not Redis
    # Wait for informs to complete migrations before starting
    depends_on:
      informs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  test:
    build:
      context: ./informs
    env_file:
      - informs/env/django-test.env
    # The RUN_TESTS variable is now set in the env_file.
    # The entrypoint path is consistent because the script now handles the switch.
    entrypoint: /opt/app/docker-entrypoint.sh
    # This service is for running tests. It has no volumes and is fully isolated.
    # Arguments passed to 'docker compose run' are appended to the 'python manage.py test' command.
    profiles:
      - test

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Persist message cache to volume
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  takmesh:
    build:
      context: ./takmesh_gateway
    image: takmesh-gateway
    env_file:
      - takmesh_gateway/env/takmesh.env
    restart: "no"
    # REST API and WebSocket port (published for browser access)
    ports:
      - "8090:8090"
    volumes:
      - certs:/opt/app/certs:ro
      - takmesh_config:/opt/app/data
    depends_on:
      - informs
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - takmesh
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  local-db:
  certs:
  informs_staticfiles:
  informs_media:
  takmesh_config:
  redis_data:

networks:
  default:
    name: webhost
    external: true
