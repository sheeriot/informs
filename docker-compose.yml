# Base docker-compose file.

services:

  informs:
    build:
      context: ./informs
    image: informs-app
    env_file:
      - informs/env/django.env
    # entrypoint: export static_files, migrate DB, then run "command"
    entrypoint: /opt/app/docker-entrypoint.sh
    command: gunicorn --bind=0.0.0.0:8000 --workers=${WORKERS:-3} informs.wsgi
    restart: unless-stopped
    ports:
     - 8000:8000
    volumes:
      - informs_staticfiles:/opt/app/static_files
      - local-db:/opt/app/db
      - certs:/opt/app/certs:z

  queues:
    image: informs-app
    restart: unless-stopped
    env_file:
      - informs/env/django.env
    command: python manage.py qcluster
    volumes:
      - informs_staticfiles:/opt/app/static_files
      - local-db:/opt/app/db
      - certs:/opt/app/certs:z

  test:
    build:
      context: ./informs
    env_file:
      - informs/env/django-test.env
    # The RUN_TESTS variable is now set in the env_file.
    # The entrypoint path is consistent because the script now handles the switch.
    entrypoint: /opt/app/docker-entrypoint.sh
    # This service is for running tests. It has no volumes and is fully isolated.
    # Arguments passed to 'docker compose run' are appended to the 'python manage.py test' command.
    profiles:
      - test

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Persist message cache to volume
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  takmesh:
    build:
      context: ./takmesh_gateway
    image: takmesh-gateway
    env_file:
      - takmesh_gateway/env/takmesh.env
    restart: unless-stopped
    # REST API and WebSocket port (published for browser access)
    ports:
      - "8090:8090"
    volumes:
      - certs:/opt/app/certs:ro
      - takmesh_config:/opt/app/data
    depends_on:
      - informs
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  local-db:
  certs:
  informs_staticfiles:
  takmesh_config:
  redis_data:

networks:
  default:
    name: webhost
    external: true
