# Production override - activate with: ln -sf docker-compose.override-prod.yml docker-compose.override.yml
# Uses gunicorn (from base), with production-specific settings

services:
  informs:
    # Production uses gunicorn from base config
    # Uncomment below to enable debug logging (requires rebuild: docker compose build)
    # environment:
    #   - DEBUG=True
    #   - DJANGO_DEBUG_TOOLBAR=False

  queues:
    # Uncomment to enable debug logging for queue workers
    # environment:
    #   - DEBUG=True

  takmesh:
    # TAKMesh gateway disabled in production until needed
    # To enable: docker compose --profile takmesh up -d takmesh
    profiles:
      - takmesh
