<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 110 56" width="110" height="56">
  <!-- Background -->
  <rect x="10" y="0" width="110" height="56" fill="#f4e6c5"/>

  <!-- Striations -->
  <g stroke="#e1d5aa" stroke-width="1.1" opacity="0.6">
    <line x1="10" y1="20" x2="120" y2="20"/>
    <line x1="10" y1="28" x2="120" y2="28"/>
    <line x1="10" y1="36" x2="120" y2="36"/>
    <line x1="10" y1="44" x2="120" y2="44"/>
  </g>

  <!-- Title -->
  <text x="70" y="14" text-anchor="middle" font-size="14" fill="#4e3b2c"
        font-family="sans-serif" font-weight="bold">Tracks</text>

  <!-- Bird foot definition -->
  <defs>
    <g id="foot" stroke="#4e3b2c" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="0" x2="11" y2="-6"/>
      <line x1="0" y1="0" x2="11" y2="6"/>
    </g>
  </defs>

  <!-- Footprints -->
  <g>
    <use href="#foot" x="20"  y="28"/>
    <use href="#foot" x="40"  y="36"/>
    <use href="#foot" x="60"  y="28"/>
    <use href="#foot" x="80"  y="36"/>
    <use href="#foot" x="100" y="28"/>
  </g>
</svg>
