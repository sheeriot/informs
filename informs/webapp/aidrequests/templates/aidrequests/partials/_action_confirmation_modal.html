{% load bootstrap_icons %}
<div class="modal fade" id="actionConfirmationModal" tabindex="-1" aria-labelledby="actionConfirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="actionConfirmationModalLabel">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="modal-body-dynamic mb-3">
                    <!-- Dynamic content goes here -->
                    <p>Are you sure you want to perform this action?</p>
                </div>
                <div class="mb-3">
                    <label for="actionNoteTextarea" class="form-label">Add a note (optional):</label>
                    <textarea class="form-control action-note-textarea" id="actionNoteTextarea" rows="2"></textarea>
                </div>
                <div class="form-check mt-2">
                  <input class="form-check-input action-markdown-checkbox" type="checkbox" value="" id="actionMarkdownCheckbox">
                  <label class="form-check-label" for="actionMarkdownCheckbox">
                    Enable Markdown for Note
                  </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% bs_icon 'x-circle' %} Cancel</button>
                <button type="button" class="btn btn-primary confirm-action-btn">
                    <span class="button-icon"></span>
                    <span class="button-text">Confirm</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const confirmationModal = document.getElementById('actionConfirmationModal');
        if (confirmationModal) {
            confirmationModal.addEventListener('hidden.bs.modal', function () {
                const closeButton = confirmationModal.querySelector('.btn-close');
                if (closeButton && document.activeElement === closeButton) {
                    closeButton.blur();
                }
            });
        }
    });
</script>

<!--
  This hidden button is used as a generic trigger for the action confirmation modal,
  especially for actions that aren't initiated by a direct button click on the modal's
  final target, like the status/priority radio buttons. The JavaScript will find this
  button, populate its data attributes, and then programmatically click it to show the modal.
-->
<button id="status-priority-change-trigger"
        class="d-none"
        data-bs-toggle="modal"
        data-bs-target="#actionConfirmationModal"
        data-action-url="{% url 'aid_request_ajax_update' field_op=aid_request.field_op.slug pk=aid_request.pk %}"
></button>
