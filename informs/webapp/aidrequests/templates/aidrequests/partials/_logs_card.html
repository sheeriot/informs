<div class="card m-0 p-0">
    <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs" id="logTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="action-logs-tab" data-bs-toggle="tab" data-bs-target="#action-logs-tab-pane" type="button" role="tab" aria-controls="action-logs-tab-pane" aria-selected="true">Action Logs</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="audit-logs-tab" data-bs-toggle="tab" data-bs-target="#audit-logs-tab-pane" type="button" role="tab" aria-controls="audit-logs-tab-pane" aria-selected="false">Audit Logs</button>
            </li>
        </ul>
    </div>
    <div class="card-body">
        <div class="tab-content" id="logTabsContent">
            <div class="tab-pane fade show active" id="action-logs-tab-pane" role="tabpanel" aria-labelledby="action-logs-tab" tabindex="0">
                {% include 'aidrequests/partials/action_logs_tab.html' %}
            </div>
            <div class="tab-pane fade" id="audit-logs-tab-pane" role="tabpanel" aria-labelledby="audit-logs-tab" tabindex="0">
                {% include 'aidrequests/partials/audit_logs_tab.html' %}
            </div>
        </div>
    </div>
</div>
