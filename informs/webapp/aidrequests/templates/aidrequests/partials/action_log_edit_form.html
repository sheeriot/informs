{% load crispy_forms_tags %}
<tr>
    <td colspan="4">
        <form hx-post="{% url 'update_action_log' pk=log.pk %}" hx-target="closest tr" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="mb-2">
                <textarea name="note" class="form-control" rows="3">{{ log.note }}</textarea>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="is_markdown" id="edit-markdown-{{ log.pk }}" {% if log.is_markdown %}checked{% endif %}>
                <label class="form-check-label" for="edit-markdown-{{ log.pk }}">
                    Enable Markdown
                </label>
            </div>
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-sm btn-secondary me-2"
                        hx-get="{% url 'get_action_log_row' pk=log.pk %}"
                        hx-target="closest tr"
                        hx-swap="outerHTML">
                    Cancel
                </button>
                <button type="submit" class="btn btn-sm btn-primary">Save Changes</button>
            </div>
        </form>
    </td>
</tr>
