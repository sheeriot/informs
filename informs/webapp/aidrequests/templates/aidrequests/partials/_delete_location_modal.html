<!-- Delete Location Confirmation Modal -->
<div class="modal fade" id="deleteLocationModal" tabindex="-1" aria-labelledby="deleteLocationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteLocationModalLabel"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="deleteLocationModalBody">
        <p>Are you sure you want to delete this location?</p>
        <div id="location-details-container"></div>
        <div class="mt-3">
            <label for="delete-location-note" class="form-label">Add a note (optional):</label>
            <textarea class="form-control" id="delete-location-note" rows="2"></textarea>
        </div>
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" value="" id="delete-location-markdown-check">
          <label class="form-check-label" for="delete-location-markdown-check">
            Enable Markdown
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-circle"></i> Cancel
        </button>
        <button type="button" class="btn btn-danger" id="confirmDeleteLocationButton">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>
