{% load crispy_forms_tags %}
{% load bootstrap_icons %}

<div class="modal-header">
    <h5 class="modal-title" id="genericEditModalLabel">Edit Address</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <form id="address-edit-form"
          hx-post="{{ hx_url }}"
          hx-target="#address-info-section"
          hx-swap="outerHTML">
        {% csrf_token %}
        {{ form|crispy }}
    </form>
</div>
<div class="modal-footer justify-content-between">
    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" id="edit-confirmation-eyeball" onchange="document.getElementById('address-save-button').disabled = !this.checked;">
        <label class="form-check-label" for="edit-confirmation-eyeball">
            {% bs_icon 'eye-fill' %} Confirm Change
        </label>
    </div>
    <div>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="address-edit-form" id="address-save-button" class="btn btn-primary" disabled>
            {% bs_icon 'check-circle-fill' %} Save Address
        </button>
    </div>
</div>
