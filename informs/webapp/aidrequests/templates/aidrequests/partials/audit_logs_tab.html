<div class="table-responsive">
    <table class="table table-sm w-100">
        <thead class="table-light">
            <tr>
                <th scope="col" class="col-2 text-nowrap">Timestamp</th>
                <th scope="col" class="col-1 text-nowrap">User</th>
                <th scope="col" class="col-1 text-nowrap">Action</th>
                <th scope="col">Changes</th>
            </tr>
        </thead>
        <tbody id="audit-logs-tbody"
               hx-get="{% url 'get_audit_logs_partial' field_op=aid_request.field_op.slug pk=aid_request.pk %}"
               hx-trigger="auditLogUpdated from:body"
               hx-swap="afterbegin">
            {% for log in audit_logs %}
                {% include 'aidrequests/partials/_audit_log_row.html' with log=log %}
            {% empty %}
                <tr>
                    <td colspan="4" class="text-center text-muted">No audit logs found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
