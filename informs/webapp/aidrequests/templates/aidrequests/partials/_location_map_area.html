{% load static %}
{% load bootstrap_icons %}

{% if location.static_map_url %}
    <a href="#" class="preview-map-btn" data-map-url="{{ location.static_map_url }}" title="Click to enlarge map">
        <img src="{{ location.static_map_url }}" alt="Map of location {{ location.pk }}" class="img-fluid rounded" style="cursor: pointer;">
    </a>
{% else %}
    <div class="text-center text-muted p-3">
        <div class="spinner-border spinner-border-sm text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <small class="ms-2">Loading map...</small>
    </div>
{% endif %}

<div id="map-spinner-{{ location.pk }}" class="spinner-overlay d-none">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-text">Generating Map...</div>
</div>
