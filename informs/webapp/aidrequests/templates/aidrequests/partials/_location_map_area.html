{% load static %}

{% if map_ready %}
    {% if aid_location.map_filename %}
        <img src="{% url 'serve_map_file' field_op=aid_request.field_op.slug aid_request_pk=aid_request.pk filename=aid_location.map_filename %}" alt="Map of {{ aid_location.free_form_address }}" class="img-fluid">
    {% else %}
        <div class="alert alert-secondary text-center">
            <div class="spinner-border spinner-border-sm" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <span class="ms-2">Map image is generating...</span>
        </div>
    {% endif %}
{% else %}
    <div class="alert alert-info d-flex align-items-center" role="alert">
        <div class="flex-grow-1">
            The location map is being generated. Please refresh the page in a few moments to see it.
        </div>
        <button class="btn btn-primary btn-sm ms-3" onclick="window.location.reload();">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>
{% endif %}
