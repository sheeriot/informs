{% load crispy_forms_tags %}
{% load bootstrap_icons %}

<div class="modal-header">
    <h5 class="modal-title" id="genericEditModalLabel">Edit {{ field_label }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <form id="generic-edit-form"
          hx-post="{{ save_url }}"
          hx-target="#{{ field_name }}_display"
          hx-swap="innerHTML">
        {% csrf_token %}
        {{ form|crispy }}
    </form>
</div>
<div class="modal-footer justify-content-between">
    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" id="edit-confirmation-toggle">
        <label class="form-check-label text-danger" for="edit-confirmation-toggle" id="edit-confirmation-label">
            <i class="bi bi-lock-fill"></i> Locked
        </label>
    </div>
    <div>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" form="generic-edit-form" id="generic-save-button" class="btn btn-primary" disabled>
            {% bs_icon 'check-circle-fill' %} Save
        </button>
    </div>
</div>

<script>
    // Ensure modal content is cleared when it's hidden to prevent stale data
    (function() {
        const modal = document.getElementById('genericEditModal');
        const modalContent = document.getElementById('generic-modal-content');
        if (modal && modalContent) {
            modal.addEventListener('hidden.bs.modal', () => {
                modalContent.innerHTML = '';
            });
        }

        const toggle = document.getElementById('edit-confirmation-toggle');
        const label = document.getElementById('edit-confirmation-label');
        const saveButton = document.getElementById('generic-save-button');
        const icon = label.querySelector('i');

        if (toggle && label && saveButton && icon) {
            toggle.addEventListener('change', function() {
                if (this.checked) {
                    saveButton.disabled = false;
                    label.classList.remove('text-danger');
                    label.classList.add('text-success');
                    icon.classList.remove('bi-lock-fill');
                    icon.classList.add('bi-unlock-fill');
                    label.innerHTML = '<i class="bi bi-unlock-fill"></i> Unlocked';
                } else {
                    saveButton.disabled = true;
                    label.classList.remove('text-success');
                    label.classList.add('text-danger');
                    icon.classList.remove('bi-unlock-fill');
                    icon.classList.add('bi-lock-fill');
                    label.innerHTML = '<i class="bi bi-lock-fill"></i> Locked';
                }
            });
        }
    })();
</script>
